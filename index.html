<!doctype html>
<html lang="en">
  <head>
    <!-- Basic SEO -->
    <meta charset="UTF-8" />

    <title>
      DentalCare | Dental Clinic Management System
    </title>

    <meta
      name="description"
      content="DentalCare is a modern dental clinic management system for managing patients, dentists, appointments, treatments, schedules, payments, and clinic settings."

    <meta
      name="keywords"
      content="dental clinic management system, dental management software, dentist management, patient management, dental appointments, clinic management, DentalCare"
    />

    <meta name="author" content="DentalCare" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large"
    />

    <!-- Mobile / Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#2563EB"
    />

    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image"
      href="/icons.jpg"
    />

    

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://your-domain.com/"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="DentalCare | Dental Clinic Management System"
    />

    <meta
      property="og:description"
      content="Modern dental clinic management software for patients, dentists, appointments, treatments, schedules, payments, and clinic management."
    />

    <meta
      property="og:url"
      content="https://your-domain.com/"
    />

    <meta
      property="og:site_name"
      content="DentalCare"
    />

    <meta
      property="og:image"
      content="https://your-domain.com/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="DentalCare Dental Clinic Management System"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="DentalCare | Dental Clinic Management System"
    />

    <meta
      name="twitter:description"
      content="Modern dental clinic management software for managing patients, dentists, appointments, treatments, schedules, and payments."
    />

    <meta
      name="twitter:image"
      content="https://your-domain.com/og-image.png"
    />

    <!-- Performance -->
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <!-- Web App -->
    <meta
      name="application-name"
      content="DentalCare"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="DentalCare"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
